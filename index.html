<style>
:root{--crimson:#A51C30;--crimson-d:#6F1220;--crimson-l:#C8455A;--bg:#f7f5f5;--card:#fff;
  --ink:#1e232a;--muted:#6e7681;--line:#e6e2e2;--hi:#fdf3f4;--green:#1E7A34;--green-l:#e6f4ea;
  --amber:#b7791f;--amber-l:#fff6e5;--sat:#f3e9eb;--radius:12px;
  --shadow:0 1px 2px rgba(30,20,22,.06),0 8px 24px rgba(30,20,22,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--crimson:#e2687d;--crimson-d:#f093a3;
  --crimson-l:#c8455a;--bg:#141416;--card:#1c1d20;--ink:#e9eaec;--muted:#9aa0a8;--line:#2e2f34;--hi:#2a1c20;
  --green:#63c97e;--green-l:#173021;--amber:#e3b04b;--amber-l:#2e2612;--sat:#2a2024;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif}
/* standalone (home-screen) mode has no browser chrome: keep the header clear of the notch */
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top)}
body{padding-bottom:env(safe-area-inset-bottom)}
.hbar{height:3px;background:linear-gradient(90deg,var(--crimson),var(--crimson-d))}
.hin{padding:9px 14px;display:flex;gap:10px;align-items:center}
.hin img{width:34px;height:34px;object-fit:contain}
.t1{font-size:15px;font-weight:700;color:var(--crimson);line-height:1.15}
.t2{font-size:11px;color:var(--muted)}
.grow{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:9px;cursor:pointer}
button.primary{background:var(--crimson);color:#fff;border-color:var(--crimson);font-weight:600}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:25}
.tabs button{flex:1;border:0;border-radius:0;padding:10px 4px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--crimson);border-bottom-color:var(--crimson)}
.wrap{max-width:820px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.hero{display:flex;gap:14px;align-items:center}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--crimson)}
.ring .pct small{font-size:10px;color:var(--muted);font-weight:500}
.kv{font-size:13px;color:var(--muted);line-height:1.7}
.kv b{color:var(--ink)}
.status{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.st-ok{background:var(--green-l);color:var(--green)}.st-late{background:var(--hi);color:var(--crimson)}.st-ahead{background:#e8f0fb;color:#1f4e79}
.today h3{margin:0 0 8px;font-size:14px;color:var(--crimson)}
.trow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.tname{flex:1;font-size:14px}.tname small{display:block;color:var(--muted);font-size:12px}
.grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid col.c0{width:19%}
.grid th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.grid td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.grid td.ch{white-space:nowrap;font-weight:700;color:var(--crimson);font-size:13px;width:1%}
.grid td.ch small{display:block;font-weight:500;color:var(--muted);font-size:11px;white-space:normal}
.cell{border:1px solid var(--line);border-radius:10px;padding:6px 7px;background:var(--card);transition:.15s;width:100%;overflow:hidden}
.cell.done{background:var(--green-l);border-color:var(--green)}
.cell.late{border-color:var(--crimson);background:var(--hi)}
.cell.opt{background:var(--bg)}
.cell.hw{opacity:.55}
.due{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center;margin-bottom:5px;white-space:nowrap}
.due b{color:var(--ink);font-weight:600}
.we{background:var(--crimson);color:#fff;border-radius:5px;padding:0 5px;font-size:10px;font-weight:700}
.wd{background:var(--line);color:var(--muted);border-radius:5px;padding:0 5px;font-size:10px}
.pills{display:flex;gap:4px;width:100%}
/* 三个勾等宽、固定：打勾只改颜色和一个伪元素，绝不改变宽度 */
.pill{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap;border:1.5px solid var(--line);border-radius:8px;height:30px;display:flex;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:.12s;background:var(--card)}
.pill::before{content:'';display:inline-block;width:0;transition:.12s}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
.pill.on::before{content:'✓';width:12px;font-weight:700}
.pill:active{transform:scale(.94)}
.done .pill.on{background:var(--green)}
.n{font-size:11px;color:var(--muted)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{background:var(--sat);border-radius:99px;padding:4px 11px;font-size:12px}
.badge b{color:var(--crimson)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--card);padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:60}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--ink);max-width:min(560px,94vw);width:560px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(20,10,12,.6)}
.dh{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.db{padding:14px}
.mono{font:12px/1.5 ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
/* ---- 手机：表格换成按章节堆叠的卡片，不横向滚动 ---- */
.stack{display:none}
.chapter{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.chapter .chh{padding:9px 12px;font-weight:700;color:var(--crimson);border-bottom:1px solid var(--line);font-size:14px}
.chapter .chh small{font-weight:500;color:var(--muted);margin-left:6px}
.srow{padding:8px 12px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow.done{background:var(--green-l)}.srow.late{background:var(--hi);box-shadow:inset 3px 0 0 var(--crimson)}.srow.opt{opacity:.85}.srow.hw{opacity:.5}
.srow .sh{display:flex;gap:6px;align-items:center;font-size:13px;margin-bottom:6px}
.srow .sh b{color:var(--ink)}
@media(max-width:760px){.tablewrap{display:none}.stack{display:block}}
@media(max-width:520px){
  .hin{padding:7px 10px;gap:8px}.hin img{width:28px;height:28px}.t1{font-size:13.5px}.t2{display:none}
  #btnName{padding:5px 8px;font-size:12px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #btnSync{padding:5px 10px;font-size:13px}
  .tabs{top:46px}.tabs button{padding:7px 4px;font-size:13px}
  .grid th:nth-child(1),.grid td.ch{position:sticky;left:0;background:var(--card);z-index:2}
  .pill{font-size:11px;height:30px}
  .trow{flex-wrap:wrap}.trow .pills{width:100%}}
@media(min-width:761px) and (max-width:1024px){.wrap{padding:12px 14px 40px}.pill{font-size:11px}}
</style>
</head>

const KEY='ial27w.plan.v1', NKEY='ial27w.plan.name';

const CHECK_LABEL={a:'做题',b:'对答案',c:'错题清零'};
let state=JSON.parse(localStorage.getItem(KEY)||'{}');     // {setId:{a:ts,b:ts,c:ts}}
let name=localStorage.getItem(NKEY)||'';
let paper=localStorage.getItem('ial27w.plan.tab')||'p2';
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>{const [y,m,dd]=d.split('-');return `${+m}/${+dd}`;};
const DOW='一二三四五六日';
const toast=(()=>{let t;return m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(t);t=setTimeout(()=>e.classList.remove('show'),1800);};})();
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));pushLive();};
const isDone=id=>{const s=state[id]||{};return CHECKS.every(c=>s[c]);};
const setsOf=p=>PLAN.papers[p].sets;

/* ---------- progress code: 3 bits per set in PLAN order, base64url ---------- */
function encode(){const bits=[];for(const p of PAPERS)for(const s of setsOf(p))for(const c of CHECKS)bits.push((state[s.id]||{})[c]?1:0);
  const bytes=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|(bits[i+j]||0);bytes.push(b);}
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function decode(code){const b64=code.trim().replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b64+'==='.slice((b64.length+3)%4));
  const bits=[];for(let i=0;i<bin.length;i++){const b=bin.charCodeAt(i);for(let j=7;j>=0;j--)bits.push((b>>j)&1);}
  const out={};let k=0;const ts=Date.now();
  for(const p of PAPERS)for(const s of setsOf(p)){const o={};for(const c of CHECKS){if(bits[k++])o[c]=ts;}if(Object.keys(o).length)out[s.id]=o;}
  return out;}

/* ---------- optional live sync (Supabase REST) ---------- */
const SY=window.PLAN_SYNC||{};const live=()=>!!(SY.url&&SY.key);
let pushT;function pushLive(){if(!live()||!name)return;clearTimeout(pushT);pushT=setTimeout(async()=>{
  try{await fetch(`${SY.url}/rest/v1/${SY.table||'progress'}`,{method:'POST',headers:{apikey:SY.key,Authorization:'Bearer '+SY.key,
    'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},
    body:JSON.stringify({name,code:encode(),updated_at:new Date().toISOString()})});}catch(e){}},800);}

/* ---------- stats ---------- */
function stats(p){const P=PLAN.papers[p],req=P.sets.filter(s=>s.required);
  const done=req.filter(s=>isDone(s.id)).length;
  const td=today();const planned=P.deadline?req.filter(s=>s.due<=td).length:0;
  const late=P.deadline?req.filter(s=>s.due<td&&!isDone(s.id)):[];
  const optDone=P.sets.filter(s=>!s.required&&s.set==='EX'&&isDone(s.id)).length;
  return {req:req.length,done,planned,late,pct:req.length?Math.round(done/req.length*100):0,optDone};}
function streak(){const days=new Set();for(const s of Object.values(state))for(const c of CHECKS)if(s[c])days.add(new Date(s[c]).toISOString().slice(0,10));
  let n=0,d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(days.has(k)){n++;d.setDate(d.getDate()-1);}else break;}return n;}

/* ---------- render ---------- */
function renderTabs(){$('#tabs').innerHTML=PAPERS.map(p=>{const st=stats(p);
  return `<button data-p="${p}" aria-pressed="${p===paper}">${PLAN.papers[p].label.split(' ')[0]} ${PLAN.papers[p].label.split(' ')[1]||''}<br><small style="font-weight:500">${st.pct}%</small></button>`;}).join('');}
function render(){renderTabs();$('#nameLbl').textContent=name||'未署名';
  const P=PLAN.papers[paper],st=stats(paper),td=today();
  const r=44,C=2*Math.PI*r;
  let status='';if(P.deadline){const d=st.done-st.planned;
    status=d<0?`<span class="status st-late">落后 ${-d} 套</span>`:d>0?`<span class="status st-ahead">领先 ${d} 套</span>`:`<span class="status st-ok">按计划进行</span>`;}
  const daysLeft=P.exam?Math.ceil((new Date(P.exam)-new Date(td))/864e5):null;
  let html=`<div class="card hero"><div class="ring"><svg width="96" height="96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--crimson)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-st.pct/100)}" style="transition:.5s"/></svg>
    <div class="pct">${st.pct}%<small>${st.done}/${st.req} 套</small></div></div>
    <div class="kv"><div><b>${P.examLabel}</b></div>${P.exam?`<div>距考试 <b>${daysLeft}</b> 天 · 全部完成截止 <b>${fmt(P.deadline)}</b></div>`:''}
    ${P.weekdayMin?`<div>建议节奏：平日 <b>${P.weekdayMin}</b> min · 周末 <b>${P.weekendMin}</b> min</div>`:''}
    <div style="margin-top:4px">${status}</div></div></div>`;
  // today
  if(P.deadline){const due=P.sets.filter(s=>s.required&&!isDone(s.id)&&s.due<=td).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4);
    const next=P.sets.filter(s=>s.required&&!isDone(s.id)&&s.due>td).slice(0,1);
    const items=due.length?due:next;
    html+=`<div class="card today"><h3>${due.length?(st.late.length?'⏰ 待补 + 今天':'📌 今天的任务'):'✅ 今天没有新任务，下一套：'}</h3>${
      items.map(s=>`<div class="trow"><div class="tname">第${s.ch}章 ${PLAN.chapters[s.ch]} · <b>${PLAN.setLabels[s.set]}</b><small>${s.n} 题 · 约 ${Math.round(s.min)} min · 截止 ${fmt(s.due)} 周${DOW[s.dow]}${s.due<td?' · 已过期':''}</small></div>${pills(s)}</div>`).join('')||'<div class="n">全部完成 🎉</div>'}</div>`;}
  const sk=streak();
  html+=`<div class="card"><div class="badges"><span class="badge">已完成 <b>${st.done}</b> 套</span>${st.optDone?`<span class="badge">选做 <b>${st.optDone}</b> 套</span>`:''}<span class="badge">连续打卡 <b>${sk}</b> 天</span>${st.late.length?`<span class="badge">待补 <b>${st.late.length}</b> 套</span>`:''}</div></div>`;
  html+=`<div class="card"><div class="legend"><span><span class="we">周末</span> 周末量</span><span><span class="wd">平日</span> 平日量</span><span>三个勾：做题 → 对答案 → 错题清零</span></div>
    <div class="tablewrap"><table class="grid"><colgroup><col class="c0"><col><col><col><col></colgroup><tr><th>章节</th>${SETCODES.map(c=>`<th>${PLAN.setLabels[c]}${c==='EX'?'<br><small style="font-weight:400">选做</small>':c==='HW'?'<br><small style="font-weight:400">已完成</small>':''}</th>`).join('')}</tr>`;
  for(const ch of P.chapters){html+=`<tr><td class="ch">第${ch}章<small>${PLAN.chapters[ch]}</small></td>`;
    for(const c of SETCODES){const s=P.sets.find(x=>x.ch===ch&&x.set===c);
      if(!s){html+='<td><span class="n">—</span></td>';continue;}
      const dn=isDone(s.id),late=s.required&&s.due&&s.due<td&&!dn;
      html+=`<td><div class="cell ${dn?'done':''} ${late?'late':''} ${!s.required?(c==='HW'?'hw':'opt'):''}">
        <div class="due">${s.due?`<b>${fmt(s.due)}</b><span class="${s.dow>=5?'we':'wd'}">${s.dow>=5?'周末':'平日'}</span>`:`<span class="n">${c==='HW'?'作业已交':'有余力再做'}</span>`}<span class="n">${s.n}题</span></div>${pills(s)}</div></td>`;}
    html+='</tr>';}
  html+='</table></div>';
  html+='<div class="stack">'+P.chapters.map(ch=>{
    const rows=SETCODES.map(c=>P.sets.find(x=>x.ch===ch&&x.set===c)).filter(Boolean);
    const nd=rows.filter(s=>s.required&&isDone(s.id)).length, nr=rows.filter(s=>s.required).length;
    return `<div class="chapter"><div class="chh">第${ch}章 ${PLAN.chapters[ch]}<small>${nd}/${nr}</small></div>${rows.map(s=>{
      const dn=isDone(s.id),late=s.required&&s.due&&s.due<td&&!dn;
      return `<div class="srow ${dn?'done':''} ${late?'late':''} ${!s.required?(s.set==='HW'?'hw':'opt'):''}">
        <div class="sh"><b>${PLAN.setLabels[s.set]}</b>${s.due?`<span>${fmt(s.due)}</span><span class="${s.dow>=5?'we':'wd'}">${s.dow>=5?'周末':'平日'}</span>`:`<span class="n">${s.set==='HW'?'作业已交':'选做'}</span>`}<span class="n">· ${s.n}题${late?' · 已过期':''}</span></div>${pills(s)}</div>`;}).join('')}</div>`;}).join('')+'</div></div>';
  $('#wrap').innerHTML=html;}
function pills(s){const st=state[s.id]||{};return `<div class="pills">${CHECKS.map(c=>`<div class="pill ${st[c]?'on':''}" data-id="${s.id}" data-c="${c}">${CHECK_LABEL[c]}</div>`).join('')}</div>`;}

/* ---------- interactions ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('.tabs button');if(t){paper=t.dataset.p;localStorage.setItem('ial27w.plan.tab',paper);render();return;}
  const p=e.target.closest('.pill');if(!p)return;
  const id=p.dataset.id,c=p.dataset.c;const s=state[id]||(state[id]={});
  const was=isDone(id);
  if(s[c])delete s[c];else s[c]=Date.now();
  save();render();
  if(!was&&isDone(id)){const set=PAPERS.flatMap(pp=>setsOf(pp)).find(x=>x.id===id);const st=stats(paper);
    confetti();toast(`🎉 第${set.ch}章 ${PLAN.setLabels[set.set]} 完成！${st.req?` 本卷 ${st.pct}%`:''}`);
    if(st.req&&[25,50,75,100].includes(st.pct))setTimeout(()=>toast(st.pct===100?'🏆 本卷全部刷完！':`🎯 里程碑：${st.pct}%`),1900);}
  else if(s[c])toast(`已记录：${CHECK_LABEL[c]}`);});
function confetti(){const cv=$('#fx');cv.hidden=false;cv.width=innerWidth;cv.height=innerHeight;const x=cv.getContext('2d');
  const cols=['#A51C30','#e2687d','#f3c623','#1E7A34','#1f4e79','#fff'];
  const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:3+Math.random()*4,c:cols[Math.random()*cols.length|0],a:1,rot:Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);t++;let alive=0;for(const p of ps){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a-=.012;p.rot+=.1;if(p.a<=0)continue;alive++;
    x.save();x.globalAlpha=p.a;x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();}
    if(alive&&t<160)requestAnimationFrame(f);else{x.clearRect(0,0,cv.width,cv.height);cv.hidden=true;}})();}
$('#btnName').onclick=()=>{$('#inName').value=name;$('#dlgName').showModal();};
$('#nameOk').onclick=()=>{name=$('#inName').value.trim();localStorage.setItem(NKEY,name);$('#dlgName').close();render();pushLive();};
$('#btnSync').onclick=()=>{if(!name){$('#dlgName').showModal();return;}$('#syLive').hidden=!live();
  $('#syCode').textContent=`${name}: ${encode()}`;$('#syIn').value='';$('#dlgSync').showModal();};
$('#syClose').onclick=()=>$('#dlgSync').close();
$('#syCopy').onclick=async()=>{const t=$('#syCode').textContent;try{await navigator.clipboard.writeText(t);toast('已复制，发给老师即可');}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制');}};
$('#syLoad').onclick=()=>{const v=$('#syIn').value.trim();const m=v.match(/^(.{1,20}?)[:：,，\s]+(\S+)$/);const code=m?m[2]:v;
  try{const st=decode(code);state=st;if(m&&!name){name=m[1].trim();localStorage.setItem(NKEY,name);}save();render();$('#dlgSync').close();toast('已导入');}
  catch(e){alert('进度码无法识别');}};
if(!name)setTimeout(()=>$('#dlgName').showModal(),400);
render();
</script>
